<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사 3대 혁명 순발력 게임 - 자유의 여신 테마</title>
  <style>
    /* 기본 스타일 초기화 및 고급 고전풍 폰트 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Georgia', 'Apple SD Gothic Neo', 'Noto Sans KR', serif;
    }

    body {
      background: #0b0d12;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* 게임 컨테이너 - 명화 분위기의 고급스러운 골드/다크 테두리 */
    #game-container {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(160deg, #181a24 0%, #0d0f17 100%);
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.15);
      border: 2px solid #b8860b;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 상단 상태 바 (시간, 점수) */
    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: rgba(15, 17, 28, 0.85);
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid #d4af37;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-label {
      font-size: 12px;
      color: #c5a059;
      margin-bottom: 2px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .status-value {
      font-size: 26px;
      font-weight: 900;
      color: #ff5252;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .status-value.score {
      color: #ffd700;
    }

    .status-value.best {
      color: #00d2d3;
    }

    /* 5초 타임 바 */
    .timer-bar-container {
      width: 100%;
      height: 12px;
      background: #1c1f2e;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid #8b6508;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff4d4d, #f39c12, #00d2d3);
      transition: width 0.05s linear;
    }

    /* 스테이지 배지 */
    .stage-badge {
      background: linear-gradient(135deg, #8b0000, #b22222);
      color: #fff8dc;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 1px;
      border: 1px solid #ffd700;
      box-shadow: 0 4px 12px rgba(178, 34, 34, 0.4);
    }

    /* 들라크루아 명화 배경 무대 */
    .character-stage {
      width: 100%;
      height: 150px;
      border-radius: 14px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      border: 1px solid #d4af37;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      background: #10121a;
    }

    /* 들라크루아 배경 연기 & 전장 연출 SVG */
    .masterpiece-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 민중을 이끄는 자유의 여신 캐릭터 */
    .liberty-character {
      width: 90px;
      height: 110px;
      position: absolute;
      bottom: 8px;
      left: 15px;
      transition: left 0.4s ease, transform 0.4s ease;
      z-index: 3;
    }

    /* 캐릭터 모션 */
    .liberty-character.walk {
      animation: flagWaveWalk 0.35s infinite alternate ease-in-out;
    }

    .liberty-character.fall {
      transform: rotate(-90deg) translateY(40px);
      transition: transform 0.35s ease;
    }

    .liberty-character.cheer {
      left: calc(50% - 45px) !important;
      animation: victoryCheer 0.6s infinite alternate ease-in-out;
    }

    @keyframes flagWaveWalk {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-10px) rotate(4deg); }
    }

    @keyframes victoryCheer {
      0% { transform: translateY(0) scale(1.08); }
      100% { transform: translateY(-18px) scale(1.15); }
    }

    /* 문제 카드 - 연풍 캔버스 스타일 */
    .question-card {
      width: 100%;
      background: linear-gradient(180deg, #1f2233 0%, #141622 100%);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: center;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid #7a6322;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .question-desc {
      font-size: 13px;
      color: #ffd700;
      margin-bottom: 6px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .question-text {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.45;
      word-break: keep-all;
      color: #f1f2f6;
    }

    /* 보기 버튼 목록 */
    .options-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      background: linear-gradient(180deg, #2c3045 0%, #1e2130 100%);
      color: #ffffff;
      border: 1px solid #8b7536;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
      word-break: keep-all;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .option-btn:active {
      transform: scale(0.97);
      background: #8b0000;
      border-color: #ffd700;
      color: #ffffff;
    }

    /* 화면 오버레이 공통 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 11, 16, 0.96);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    .overlay h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .overlay p {
      font-size: 15px;
      color: #dcdde1;
      margin-bottom: 24px;
      line-height: 1.6;
      word-break: keep-all;
    }

    /* 대단원 타이틀 오버레이 */
    .stage-title-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 9, 14, 0.94);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      animation: fadeIn 0.3s ease;
    }

    .stage-title-card {
      background: linear-gradient(135deg, #1e2436, #3a1c1c);
      padding: 26px 36px;
      border-radius: 20px;
      border: 2px solid #ffd700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 215, 0, 0.2);
      text-align: center;
      animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .stage-title-card h2 {
      font-size: 15px;
      color: #ff6b6b;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .stage-title-card h1 {
      font-size: 30px;
      color: #ffd700;
      font-weight: 900;
      margin: 0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    @keyframes popUp {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .start-btn {
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #000;
      border: 1px solid #fff;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: 900;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      transition: transform 0.08s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    .hidden {
      display: none !important;
    }

    .final-score {
      font-size: 52px;
      font-weight: 900;
      color: #ffd700;
      margin: 10px 0;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 상단 상태 표시판 -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">전체 남은 시간</span>
      <span id="time-display" class="status-value">180</span>
    </div>
    <div class="status-item">
      <span class="status-label">최고 점수</span>
      <span id="best-display" class="status-value best">0</span>
    </div>
    <div class="status-item">
      <span class="status-label">현재 점수</span>
      <span id="score-display" class="status-value score">0</span>
    </div>
  </div>

  <!-- 5초 한도 타이머 바 -->
  <div class="timer-bar-container">
    <div id="step-timer-bar" class="timer-bar"></div>
  </div>

  <!-- 현재 스테이지 배지 -->
  <div id="stage-badge" class="stage-badge">1단계: 영국 혁명</div>

  <!-- 들라크루아 명화 배경 테마 무대 -->
  <div class="character-stage">
    <!-- 명화 속 전투 배경 및 바리케이드, 프랑스 삼색 연기 연출 -->
    <svg class="masterpiece-bg" viewBox="0 0 500 150" preserveAspectRatio="none">
      <defs>
        <!-- 하늘 노을 & 연기 그라데이션 -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2b1a17" />
          <stop offset="40%" stop-color="#4a3b32" />
          <stop offset="70%" stop-color="#2c3a47" />
          <stop offset="100%" stop-color="#0f141d" />
        </linearGradient>

        <!-- 명화 속 프랑스 삼색기 컬러 퍼짐 연기 -->
        <radialGradient id="smokeBlue" cx="20%" cy="30%" r="50%">
          <stop offset="0%" stop-color="#1e3799" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#1e3799" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="smokeRed" cx="80%" cy="30%" r="50%">
          <stop offset="0%" stop-color="#b71540" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#b71540" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- 하늘 배경 -->
      <rect width="500" height="150" fill="url(#skyGrad)"/>

      <!-- 삼색 분위기 연기 실루엣 -->
      <rect width="500" height="150" fill="url(#smokeBlue)"/>
      <rect width="500" height="150" fill="url(#smokeRed)"/>

      <!-- 먼 노트르담 성당 실루엣 -->
      <path d="M 400 100 L 400 65 L 415 65 L 415 100 L 425 100 L 425 60 L 440 60 L 440 100 Z" fill="#181e29" opacity="0.6"/>

      <!-- 바리케이드 돌 더미와 목재 실루엣 -->
      <path d="M 0 150 L 0 125 Q 60 115 130 135 Q 220 110 320 138 Q 420 120 500 130 L 500 150 Z" fill="#13151c"/>
      <path d="M 20 135 L 70 120 L 110 140" stroke="#3d2b1f" stroke-width="4"/>
      <path d="M 180 138 L 240 125 L 290 142" stroke="#2c1e17" stroke-width="5"/>
      <path d="M 360 132 L 430 118 L 470 138" stroke="#3d2b1f" stroke-width="4"/>
    </svg>

    <!-- 민중을 이끄는 자유의 여신 SVG 캐릭터 -->
    <div id="liberty-char" class="liberty-character">
      <svg viewBox="0 0 120 140" width="100%" height="100%">
        <!-- 삼색기 깃대 & 깃발 -->
        <g id="flag-group">
          <!-- 깃대 -->
          <line x1="60" y1="10" x2="20" y2="120" stroke="#5c4033" stroke-width="4" stroke-linecap="round"/>
          <!-- 프랑스 삼색기 (자유, 평등, 박애) -->
          <g transform="rotate(-10 50 25)">
            <rect x="50" y="15" width="18" height="36" fill="#002395"/>
            <rect x="68" y="15" width="18" height="36" fill="#ffffff"/>
            <rect x="86" y="15" width="18" height="36" fill="#ed2939"/>
          </g>
        </g>

        <!-- 자유의 여신 드레스 (고전 드레이프 예복) -->
        <path d="M 42 65 Q 35 95 38 125 L 68 125 Q 65 95 56 65 Z" fill="#d4c391"/>
        <path d="M 45 75 Q 52 100 42 125" stroke="#b3a170" stroke-width="2" fill="none"/>

        <!-- 오른팔 (깃발을 높이 드는 팔) -->
        <path id="arm-flag" d="M 48 65 Q 55 40 58 22" stroke="#e0ac69" stroke-width="7" stroke-linecap="round" fill="none"/>

        <!-- 왼팔 (총/민중을 유도하는 팔) -->
        <path id="arm-left" d="M 44 67 Q 28 78 18 85" stroke="#e0ac69" stroke-width="6" stroke-linecap="round" fill="none"/>

        <!-- 머리 및 프리기아 모자 (자유의 모자 - Phrygian cap) -->
        <circle cx="48" cy="48" r="11" fill="#e0ac69"/>
        <!-- 머리카락 -->
        <path d="M 40 44 Q 35 55 38 62" stroke="#5c3a21" stroke-width="3" fill="none"/>
        <!-- 붉은 프리기아 모자 -->
        <path d="M 40 44 Q 46 28 58 35 Q 56 46 45 47 Z" fill="#c0392b"/>

        <!-- 얼굴 윤곽 / 눈 / 입 -->
        <circle cx="51" cy="47" r="1.5" fill="#2c3e50"/>
        <path id="mouth" d="M 48 53 Q 52 56 54 53" stroke="#8e44ad" stroke-width="1.5" fill="none"/>
      </svg>
    </div>
  </div>

  <!-- 질문 영역 -->
  <div class="question-card">
    <div class="question-desc">다음 역사적 사건 직후 일어난 사건을 5초 안에 선택하세요!</div>
    <div id="question-text" class="question-text">게임 준비 중...</div>
  </div>

  <!-- 선택지 영역 -->
  <div id="options-grid" class="options-grid">
    <button class="option-btn">보기 1</button>
    <button class="option-btn">보기 2</button>
  </div>

  <!-- 대단원 타이틀 오버레이 -->
  <div id="stage-title-overlay" class="stage-title-overlay hidden">
    <div class="stage-title-card">
      <h2 id="stage-title-sub">STAGE 1</h2>
      <h1 id="stage-title-main">영국 혁명</h1>
    </div>
  </div>

  <!-- 시작 화면 오버레이 -->
  <div id="start-overlay" class="overlay">
    <h1>자유의 여신과 함께하는<br>역사 3대 혁명 퀴즈</h1>
    <p>
      <b>들라크루아의 민중을 이끄는 자유의 여신처럼!</b><br><br>
      영국 혁명 ➔ 미국 혁명 ➔ 프랑스 혁명 순서대로<br>
      제시된 역사적 사건 직후 일어난 일들을<br>
      <b>5초 안에</b> 연속하여 맞혀보세요!
    </p>
    <button class="start-btn" onclick="startGame()">혁명 시작하기</button>
  </div>

  <!-- 게임 오버 오버레이 -->
  <div id="gameover-overlay" class="overlay hidden">
    <h1 id="gameover-title">GAME OVER</h1>
    <p id="gameover-reason">오답입니다!</p>
    <div>최종 점수</div>
    <div id="final-score" class="final-score">0</div>

    <!-- 명예의 전당 (TOP 3 리더보드) -->
    <div style="width: 100%; max-width: 320px; background: rgba(0,0,0,0.5); border: 1px solid #d4af37; border-radius: 12px; padding: 12px; margin-bottom: 16px;">
      <div style="font-size: 14px; color: #ffd700; font-weight: bold; margin-bottom: 8px;">🏆 명예의 전당 (TOP 3)</div>
      <div id="leaderboard-list" style="font-size: 13px; color: #e1e1e1; display: flex; flex-direction: column; gap: 4px;">
        <!-- JS로 동적 생성 -->
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">다시 도전</button>
  </div>

  <!-- 하단 저장 안내 문구 -->
  <div style="margin-top: 10px; font-size: 11px; color: #8a8d9b; text-align: center;">
    기록은 이 브라우저에만 저장됩니다
  </div>
</div>

<script>
  // 필수 지침 규격 준수
  const GAME_ID = 'my-game';

  // 엄격한 역사적 시간 순서 및 동일 혁명 내 매력적 오답(Distractors) 적용 데이터

    // --- STAGE 2: 미국 혁명 (1765년~1776년 순서) ---
    {
      stage: 2,
      stageName: "2단계: 미국 혁명",

      correct: "'대표 없는 곳에 과세 없다'며 식민지 주민 반발",
      distractors: ["독립선언서 발표", "요크타운 전투 승리", "제2차 대륙회의 개최"]
    },
    {
      stage: 2,
      stageName: "2단계: 미국 혁명",

      correct: "보스턴 차 사건 발생 (1773)",
      distractors: ["렉싱턴 전투 발생", "미국 헌법 제정", "제1차 대륙회의 소집"]
    },
    {
      stage: 2,
      stageName: "2단계: 미국 혁명",
      situation: "7. 영국의 탄압에 맞서 렉싱턴 전투로 독립 전쟁의 총성이 울렸다.",
      correct: "제2차 대륙회의 개최 및 조지 워싱턴 총사령관 임명",
      distractors: ["보스턴 차 사건", "인지세법 제정", "파리 조약 체결"]
    },
    {
      stage: 2,

      correct: "미국 독립선언서 발표 (1776)",

    },

    // --- STAGE 3: 프랑스 혁명 (1789년~1793년 순서) ---
    {

      distractors: ["로베스피에르의 공포정치", "바스티유 감옥 습격", "루이 16세 처형"]
    },
    {
      stage: 3,
      stageName: "3단계: 프랑스 혁명",
      situation: "10. 국왕이 삼부회를 탄압하자 분노한 파리 민중들이 행동에 나섰다.",
      correct: "바스티유 감옥 습격 (1789)",
      distractors: ["삼부회 소집", "총통 정부 수립", "바렌 사건 발생"]
    },
    {
      stage: 3,
      stageName: "3단계: 프랑스 혁명",
      situation: "11. 혁명이 전국으로 확산되며 봉건제 폐지가 선언되었다.",
      correct: "인권 선언(인간과 시민의 권리 선언) 발표",
      distractors: ["삼부회 소집", "테르미도르의 반동", "바스티유 감옥 습격"]
    },
    {
      stage: 3,
      stageName: "3단계: 프랑스 혁명",
      situation: "12. 혁명 정부가 국민공회를 구성하고 국왕 루이 16세를 처형했다.",
      correct: "로베스피에르의 공포 정치 시작",
      distractors: ["테니스 코트의 서약", "삼부회 소집", "국민의회 성립"]
    }
  ];

  // 게임 상태 변수
  let currentGameQuestions = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let totalTimeLeft = 180; // 전체 제한시간 3분(180초)
  let stepTimeLeft = 5.0;  // 카운트다운 5초
  let currentStageNum = 0; 
  let startTime = 0;
  let elapsedTime = 0;

  let totalTimerInterval = null;
  let stepTimerInterval = null;
  let isGameActive = false;

  // DOM 요소
  const timeDisplay = document.getElementById('time-display');
  const scoreDisplay = document.getElementById('score-display');
  const bestDisplay = document.getElementById('best-display');
  const stepTimerBar = document.getElementById('step-timer-bar');
  const stageBadge = document.getElementById('stage-badge');
  const questionText = document.getElementById('question-text');
  const optionsGrid = document.getElementById('options-grid');
  const startOverlay = document.getElementById('start-overlay');
  const gameoverOverlay = document.getElementById('gameover-overlay');
  const gameoverTitle = document.getElementById('gameover-title');
  const gameoverReason = document.getElementById('gameover-reason');
  const finalScoreDisplay = document.getElementById('final-score');
  const leaderboardList = document.getElementById('leaderboard-list');

  // 캐릭터 DOM 및 상태
  const libertyChar = document.getElementById('liberty-char');
  const armFlag = document.getElementById('arm-flag');
  const armLeft = document.getElementById('arm-left');
  const mouth = document.getElementById('mouth');
  const stageTitleOverlay = document.getElementById('stage-title-overlay');
  const stageTitleSub = document.getElementById('stage-title-sub');
  const stageTitleMain = document.getElementById('stage-title-main');

  // 게임 시작
  function startGame() {
    score = 0;
    currentQuestionIndex = 0;
    currentStageNum = 0;
    totalTimeLeft = 180;
    isGameActive = true;
    startTime = Date.now();
    elapsedTime = 0;

    // 역사 연대기 문제 데이터 복사
    currentGameQuestions = [...chronologicalGameData];

    scoreDisplay.textContent = score;
    timeDisplay.textContent = totalTimeLeft;

    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');

    resetCharacterState();

    // 전체 타이머 시작 (3분)
    clearInterval(totalTimerInterval);
    totalTimerInterval = setInterval(() => {
      totalTimeLeft--;
      timeDisplay.textContent = totalTimeLeft;
      if (totalTimeLeft <= 0) {
        endGame("전체 제한시간(3분)이 초과되었습니다!");
      }
    }, 1000);

    // 첫 문제 확인 및 로드
    checkAndLoadQuestion();
  }

  // 자유의 여신 캐릭터 초기 상태 설정
  function resetCharacterState() {
    libertyChar.className = 'liberty-character';
    libertyChar.style.left = '15px';
    armFlag.setAttribute('d', 'M 48 65 Q 55 40 58 22');
    armLeft.setAttribute('d', 'M 44 67 Q 28 78 18 85');
    mouth.setAttribute('d', 'M 48 53 Q 52 56 54 53');
  }

  // 문제 및 단계 확인 후 진행
  function checkAndLoadQuestion() {
    if (!isGameActive) return;

    // 모든 문제를 전부 맞춘 경우 (혁명 완성!)
    if (currentQuestionIndex >= currentGameQuestions.length) {
      triggerVictory();
      return;
    }

    const q = currentGameQuestions[currentQuestionIndex];

    // 대단원 단계 변경 시 대단원 타이틀 연출
    if (q.stage !== currentStageNum) {
      currentStageNum = q.stage;
      showStageTitleOverlay(currentStageNum, () => {
        loadQuestionData(q);
      });
    } else {
      loadQuestionData(q);
    }
  }

  // 대단원 타이틀 팝업 연출 (1.4초)
  function showStageTitleOverlay(stageNum, callback) {
    clearInterval(stepTimerInterval);
    
    const titles = {
      1: { sub: "STAGE 1", main: "영국 혁명 (1628~1689)" },
      2: { sub: "STAGE 2", main: "미국 혁명 (1765~1776)" },
      3: { sub: "STAGE 3", main: "프랑스 혁명 (1789~1793)" }
    };

    stageTitleSub.textContent = titles[stageNum].sub;
    stageTitleMain.textContent = titles[stageNum].main;
    stageTitleOverlay.classList.remove('hidden');

    setTimeout(() => {
      stageTitleOverlay.classList.add('hidden');
      if (isGameActive) callback();
    }, 1400);
  }

  // 오답 보기 추출
  function getRandomDistractor(q) {
    if (q.distractors && q.distractors.length > 0) {
      const idx = Math.floor(Math.random() * q.distractors.length);
      return q.distractors[idx];
    }
    return q.wrong || "권리장전 승인";
  }

  // 실제 문제 데이터 세팅
  function loadQuestionData(q) {
    stageBadge.textContent = q.stageName;
    questionText.textContent = `"${q.situation}"`;

    const wrongOptionText = getRandomDistractor(q);

    // 보기 랜덤 섞기
    const isCorrectFirst = Math.random() < 0.5;
    const option1Text = isCorrectFirst ? q.correct : wrongOptionText;
    const option2Text = isCorrectFirst ? wrongOptionText : q.correct;

    optionsGrid.innerHTML = `
      <button class="option-btn" onclick="handleAnswer(${isCorrectFirst})">${option1Text}</button>
      <button class="option-btn" onclick="handleAnswer(${!isCorrectFirst})">${option2Text}</button>
    `;

    // 진행 비율에 따른 자유의 여신 위치 이동
    const progressPercent = (currentQuestionIndex / (currentGameQuestions.length - 1));
    const containerWidth = document.querySelector('.character-stage').clientWidth - 100;
    const newLeft = 15 + (progressPercent * Math.max(containerWidth, 220));
    libertyChar.style.left = `${newLeft}px`;

    // 5초 타이머 재설정
    resetStepTimer();
  }

  // 5초 타이머
  function resetStepTimer() {
    clearInterval(stepTimerInterval);
    stepTimeLeft = 5.0;
    stepTimerBar.style.width = '100%';

    const updateInterval = 50;
    stepTimerInterval = setInterval(() => {
      stepTimeLeft -= updateInterval / 1000;
      const percentage = Math.max(0, (stepTimeLeft / 5.0) * 100);
      stepTimerBar.style.width = `${percentage}%`;

      if (stepTimeLeft <= 0) {
        clearInterval(stepTimerInterval);
        triggerFall();
        setTimeout(() => {
          endGame("5초 제한시간이 초과되었습니다!");
        }, 500);
      }
    }, updateInterval);
  }

  // 정답/오답 제출 핸들러
  function handleAnswer(isCorrect) {
    if (!isGameActive) return;

    clearInterval(stepTimerInterval);

    if (isCorrect) {
      // 만점 100점 점수 시스템 (기본 7점 + 5초 속도 보너스 최대 1.33점)
      const baseScore = 7;
      const speedBonus = (stepTimeLeft / 5.0) * 1.333;
      const questionScore = Math.round(baseScore + speedBonus);
      
      score += questionScore;
      if (score > 100) score = 100; // 만점 제한
      
      scoreDisplay.textContent = score;

      // 정답 시 깃발을 흔들며 전진
      libertyChar.classList.add('walk');
      setTimeout(() => libertyChar.classList.remove('walk'), 400);

      currentQuestionIndex++;
      checkAndLoadQuestion();
    } else {
      // 오답 시 쓰러짐 연출 후 게임 종료
      triggerFall();
      setTimeout(() => {
        endGame("틀린 사건을 선택했습니다!");
      }, 500);
    }
  }

  // 쓰러지는 애니메이션
  function triggerFall() {
    libertyChar.classList.remove('walk');
    libertyChar.classList.add('fall');
    mouth.setAttribute('d', 'M 48 56 Q 52 50 54 56'); // 슬픈 표정
  }

  // 승리/완주 환호 연출
  function triggerVictory() {
    isGameActive = false;
    clearInterval(totalTimerInterval);
    clearInterval(stepTimerInterval);

    // 만점 100점 보정
    score = 100;
    scoreDisplay.textContent = score;

    // 자유의 여신 환호 포즈
    libertyChar.className = 'liberty-character cheer';
    armFlag.setAttribute('d', 'M 48 65 Q 60 20 65 5'); // 깃발을 더 높이 듦
    armLeft.setAttribute('d', 'M 44 67 Q 20 40 10 30'); // 왼쪽 손도 들어올림
    mouth.setAttribute('d', 'M 46 52 Q 51 60 56 52 Z'); // 환호하는 입모양

    setTimeout(() => {
      gameoverTitle.textContent = "자유와 혁명의 완주!";
      gameoverTitle.style.color = "#ffd700";
      gameoverReason.textContent = "축하합니다! 자유의 여신과 함께 3대 혁명의 연대기를 완벽하게 이끌었습니다 (100점 만점!)";
      gameOver(score);
    }, 1200);
  }

  // 게임 종료 처리
  function endGame(reason) {
    isGameActive = false;
    clearInterval(totalTimerInterval);
    clearInterval(stepTimerInterval);
    elapsedTime = Math.round((Date.now() - startTime) / 1000);

    gameoverTitle.textContent = "GAME OVER";
    gameoverTitle.style.color = "#ff4757";
    gameoverReason.textContent = reason;
    gameOver(score);
  }

  // 규격 준수: gameOver(점수) 함수 호출 및 최종 결과 표시
  function gameOver(finalScore) {
    finalScoreDisplay.textContent = finalScore;
    
    // 플레이 소요 시간 산출
    if (!elapsedTime) {
      elapsedTime = Math.round((Date.now() - startTime) / 1000);
    }

    // 점수 저장 처리 (TOP 3 업데이트)
    saveScore(finalScore, elapsedTime);

    // 저장된 TOP 3 기록 불러와 화면에 갱신
    renderLeaderboard();

    gameoverOverlay.classList.remove('hidden');
  }

  /* ==========================================================================
     ==================== 점수 저장 및 불러오기 (Local Storage) ====================
     ========================================================================== */

  const STORAGE_KEY = 'best_' + GAME_ID;

  // 저장된 점수 목록 불러오기 (배열 형태: [{score: 100, time: 24, date: '...'}, ...])
  function loadBest() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) return [];
      
      const parsed = JSON.parse(data);
      if (typeof parsed === 'number') {
        return [{ score: parsed, time: 999, date: '이전 기록' }];
      }
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.error("점수 불러오기 실패:", e);
      return [];
    }
  }

  // 점수 저장하기 (상위 3등 유지, 점수 높음 우선, 점수 같을 시 빠른 풀이시간 우선)
  function saveScore(newScore, timeTaken) {
    let scores = loadBest();

    const now = new Date();
    const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    scores.push({
      score: newScore,
      time: timeTaken || 999,
      date: dateStr
    });

    // 정렬 규칙: 1순위 - 높은 점수, 2순위 - 적은 소요 시간
    scores.sort((a, b) => {
      if (b.score !== a.score) {
        return b.score - a.score;
      }
      return a.time - b.time;
    });

    // 상위 3개만 유지
    scores = scores.slice(0, 3);

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    } catch (e) {
      console.error("점수 저장 실패:", e);
    }

    // 상단 최고 점수 텍스트 업데이트
    updateBestDisplay();
  }

  // 상단 최고 점수 텍스트 업데이트
  function updateBestDisplay() {
    const scores = loadBest();
    const topScore = scores.length > 0 ? scores[0].score : 0;
    if (bestDisplay) {
      bestDisplay.textContent = topScore;
    }
  }

  // 결과 창 TOP 3 리더보드 HTML 출력
  function renderLeaderboard() {
    const scores = loadBest();
    leaderboardList.innerHTML = '';

    if (scores.length === 0) {
      leaderboardList.innerHTML = `<div style="color: #a0a0a0; text-align: center;">기록이 없습니다.</div>`;
      return;
    }

    const medals = ['🥇', '🥈', '🥉'];
    scores.forEach((item, index) => {
      const row = document.createElement('div');
      row.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 2px 4px;';
      
      const timeText = item.time && item.time < 999 ? ` (${item.time}초)` : '';
      row.innerHTML = `
        <span>${medals[index] || (index + 1) + '.'} <b>${item.score}점</b>${timeText}</span>
        <span style="font-size: 11px; color: #888;">${item.date}</span>
      `;
      leaderboardList.appendChild(row);
    });
  }

  // 페이지 개시 시 최고 점수 표시 초기화
  window.addEventListener('DOMContentLoaded', () => {
    updateBestDisplay();
  });

  /* ==========================================================================
     ========================================================================== */
</script>
