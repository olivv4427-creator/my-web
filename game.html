<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사 3대 혁명 순발력 게임</title>
  <style>
    /* 기본 스타일 초기화 및 폰트 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #121223;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* 게임 컨테이너 */
    #game-container {
      width: 100%;
      max-width: 500px;
      background: #1a1a3a;
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 2px solid #2a2a5a;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 상단 상태 바 (시간, 점수) */
    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #0f1123;
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid #2a2a5a;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-label {
      font-size: 13px;
      color: #8d99ae;
      margin-bottom: 2px;
      font-weight: bold;
    }

    .status-value {
      font-size: 26px;
      font-weight: 900;
      color: #ff4757;
    }

    .status-value.score {
      color: #2ed573;
    }

    /* 5초 타임 바 */
    .timer-bar-container {
      width: 100%;
      height: 12px;
      background: #2b2e4a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid #3a3d5c;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffa502);
      transition: width 0.05s linear;
    }

    /* 스테이지 배지 */
    .stage-badge {
      background: #3742fa;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(55, 66, 250, 0.3);
    }

    /* 노동자 캐릭터 스테이지 영역 */
    .character-stage {
      width: 100%;
      height: 110px;
      background: linear-gradient(180deg, #1b203e 0%, #2c2c54 100%);
      border-radius: 12px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      border: 1px solid #3a3d5c;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .ground-line {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 16px;
      background: #474787;
      border-top: 2px solid #706fd3;
    }

    /* 유럽 노동자 캐릭터 SVG & 애니메이션 */
    .worker-character {
      width: 70px;
      height: 90px;
      position: absolute;
      bottom: 10px;
      left: 20px;
      transition: left 0.4s ease, transform 0.4s ease;
      z-index: 2;
    }

    /* 캐릭터 동작 클래스들 */
    .worker-character.walk {
      animation: walkBob 0.3s infinite alternate ease-in-out;
    }

    .worker-character.fall {
      transform: rotate(-90deg) translateY(30px);
      transition: transform 0.3s ease;
    }

    .worker-character.cheer {
      left: calc(50% - 35px) !important;
      animation: cheerJump 0.5s infinite alternate ease-in-out;
    }

    @keyframes walkBob {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-8px) rotate(4deg); }
    }

    @keyframes cheerJump {
      0% { transform: translateY(0) scale(1.05); }
      100% { transform: translateY(-16px) scale(1.1); }
    }

    /* 문제 카드 */
    .question-card {
      width: 100%;
      background: #0f1123;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: center;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid #2a2a5a;
    }

    .question-desc {
      font-size: 13px;
      color: #70a1ff;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .question-text {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
      word-break: keep-all;
      color: #ffffff;
    }

    /* 보기 버튼 목록 */
    .options-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      background: #2f3542;
      color: #ffffff;
      border: 2px solid #57606f;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      transition: transform 0.05s ease, background-color 0.1s ease, border-color 0.1s ease;
      word-break: keep-all;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:active {
      transform: scale(0.97);
      background: #57606f;
      border-color: #2ed573;
    }

    /* 화면 오버레이 공통 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(18, 18, 35, 0.96);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    .overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #ff4757;
    }

    .overlay p {
      font-size: 15px;
      color: #dfe4ea;
      margin-bottom: 24px;
      line-height: 1.5;
      word-break: keep-all;
    }

    /* 대단원 타이틀 오버레이 */
    .stage-title-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 17, 35, 0.92);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      animation: fadeIn 0.3s ease;
    }

    .stage-title-card {
      background: linear-gradient(135deg, #2ed573, #1e90ff);
      padding: 24px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      transform: scale(1);
      animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .stage-title-card h2 {
      font-size: 16px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    .stage-title-card h1 {
      font-size: 32px;
      color: #ffffff;
      font-weight: 900;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    @keyframes popUp {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .start-btn {
      background: #2ed573;
      color: #000;
      border: none;
      padding: 16px 36px;
      font-size: 20px;
      font-weight: 900;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
      transition: transform 0.05s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    .hidden {
      display: none !important;
    }

    .final-score {
      font-size: 48px;
      font-weight: 900;
      color: #2ed573;
      margin: 12px 0;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 상단 상태 표시판 -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">전체 남은 시간</span>

        <path d="M 48 62 L 52 62 L 50 75 Z" fill="#c0392b"/> <!-- 목 스카프/넥타이 -->

        <ellipse cx="41" cy="122" rx="8" ry="4" fill="#1e272e"/>
        <ellipse cx="57" cy="122" rx="8" ry="4" fill="#1e272e"/>

        <!-- 오른팔/왼팔 -->
        <path id="arm-left" d="M 33 58 Q 22 75 30 85" stroke="#4b382a" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path id="arm-right" d="M 67 58 Q 78 75 70 85" stroke="#4b382a" stroke-width="7" stroke-linecap="round" fill="none"/>

        <!-- 얼굴 & 머리 -->
        <circle cx="50" cy="38" r="16" fill="#f5cd79"/>
        <!-- 눈/입 -->
        <circle cx="55" cy="36" r="2" fill="#2c3e50"/>
        <path id="mouth" d="M 52 44 Q 56 47 58 43" stroke="#2c3e50" stroke-width="2" fill="none"/>

        <!-- 19세기 빵모자 (Flat Cap) -->
        <path d="M 30 32 Q 50 14 72 30 Q 75 36 68 38 L 32 38 Z" fill="#2d3436"/>
        <path d="M 52 35 Q 68 35 74 37 L 58 40 Z" fill="#000000" opacity="0.4"/> <!-- 모자 챙 -->

  </div>

  <!-- 질문 영역 -->

    <div class="question-desc">다음 역사적 사건을 5초 안에 순서대로 선택하세요!</div>
    <div id="question-text" class="question-text">게임 준비 중...</div>
  </div>

  <!-- 선택지 영역 -->
  <div id="options-grid" class="options-grid">
    <button class="option-btn">보기 1</button>
    <button class="option-btn">보기 2</button>
  </div>

  <!-- 대단원 타이틀 오버레이 -->
  <div id="stage-title-overlay" class="stage-title-overlay hidden">
    <div class="stage-title-card">
      <h2 id="stage-title-sub">STAGE 1</h2>

    </div>
  </div>

  <!-- 시작 화면 오버레이 -->
  <div id="start-overlay" class="overlay">
    <h1>역사 3대 혁명<br>연대기 퀴즈</h1>

      <b>역사적 순서대로 사건이 진행됩니다!</b><br><br>

  <!-- 게임 오버 오버레이 -->

</div>

  const optionsGrid = document.getElementById('options-grid');
  const startOverlay = document.getElementById('start-overlay');
  const gameoverOverlay = document.getElementById('gameover-overlay');
  const gameoverTitle = document.getElementById('gameover-title');
  const gameoverReason = document.getElementById('gameover-reason');
  const finalScoreDisplay = document.getElementById('final-score');

  // 캐릭터 관련 DOM 및 상태
  const workerChar = document.getElementById('worker-char');
  const armLeft = document.getElementById('arm-left');
  const armRight = document.getElementById('arm-right');
  const mouth = document.getElementById('mouth');
  const stageTitleOverlay = document.getElementById('stage-title-overlay');
  const stageTitleSub = document.getElementById('stage-title-sub');
  const stageTitleMain = document.getElementById('stage-title-main');

  // 게임 시작
  function startGame() {
    score = 0;
    currentQuestionIndex = 0;
    currentStageNum = 0;
    totalTimeLeft = 180;
    isGameActive = true;

    // 사건 순서 데이터 복사
    currentGameQuestions = [...chronologicalGameData];

    scoreDisplay.textContent = score;
    timeDisplay.textContent = totalTimeLeft;

    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');

    resetCharacterState();

    // 전체 타이머 시작 (3분)
    clearInterval(totalTimerInterval);
    totalTimerInterval = setInterval(() => {
      totalTimeLeft--;
      timeDisplay.textContent = totalTimeLeft;
      if (totalTimeLeft <= 0) {
        endGame("전체 제한시간(3분)이 초과되었습니다!");
      }
    }, 1000);

    // 첫 문제 로드
    checkAndLoadQuestion();
  }

  // 캐릭터 기본 상태 초기화
  function resetCharacterState() {
    workerChar.className = 'worker-character';
    workerChar.style.left = '20px';
    armLeft.setAttribute('d', 'M 33 58 Q 22 75 30 85');
    armRight.setAttribute('d', 'M 67 58 Q 78 75 70 85');
    mouth.setAttribute('d', 'M 52 44 Q 56 47 58 43');
  }

  // 문제 및 단계 확인 후 로드
  function checkAndLoadQuestion() {
    if (!isGameActive) return;

    // 모든 문제를 전부 맞춘 경우 (클리어!)
    if (currentQuestionIndex >= currentGameQuestions.length) {
      triggerVictory();
      return;
    }

    const q = currentGameQuestions[currentQuestionIndex];

    // 새로운 단계 시작 시 대단원 타이틀 연출
    if (q.stage !== currentStageNum) {
      currentStageNum = q.stage;
      showStageTitleOverlay(currentStageNum, () => {
        loadQuestionData(q);
      });
    } else {
      loadQuestionData(q);
    }
  }

  // 대단원 타이틀 연출 (1.4초 표시 후 진행)
  function showStageTitleOverlay(stageNum, callback) {
    clearInterval(stepTimerInterval);
    
    const titles = {
      1: { sub: "STAGE 1", main: "영국 혁명 (1628~1689)" },
      2: { sub: "STAGE 2", main: "미국 혁명 (1765~1776)" },
      3: { sub: "STAGE 3", main: "프랑스 혁명 (1789~1793)" }
    };

    stageTitleSub.textContent = titles[stageNum].sub;
    stageTitleMain.textContent = titles[stageNum].main;
    stageTitleOverlay.classList.remove('hidden');

    setTimeout(() => {
      stageTitleOverlay.classList.add('hidden');
      if (isGameActive) callback();
    }, 1400);
  }

  // 오답 선택지 랜더링용 오답 랜덤 추출
  function getRandomDistractor(q) {
    if (q.distractors && q.distractors.length > 0) {
      const idx = Math.floor(Math.random() * q.distractors.length);
      return q.distractors[idx];
    }
    return q.wrong || "권리장전 승인";
  }

  // 실제 문제 데이터 로드
  function loadQuestionData(q) {
    stageBadge.textContent = q.stageName;
    questionText.textContent = `"${q.situation}"`;

    const wrongOptionText = getRandomDistractor(q);

    // 보기 섞기
    const isCorrectFirst = Math.random() < 0.5;
    const option1Text = isCorrectFirst ? q.correct : wrongOptionText;
    const option2Text = isCorrectFirst ? wrongOptionText : q.correct;

    optionsGrid.innerHTML = `
      <button class="option-btn" onclick="handleAnswer(${isCorrectFirst})">${option1Text}</button>
      <button class="option-btn" onclick="handleAnswer(${!isCorrectFirst})">${option2Text}</button>
    `;

    // 캐릭터 위치 업데이트 (진행도 비율에 맞게 위치 이동)
    const progressPercent = (currentQuestionIndex / (currentGameQuestions.length - 1));
    const containerWidth = document.querySelector('.character-stage').clientWidth - 90;
    const newLeft = 20 + (progressPercent * Math.max(containerWidth, 200));
    workerChar.style.left = `${newLeft}px`;

    // 5초 타이머 재설정
    resetStepTimer();
  }

  // 5초 문제 타이머
  function resetStepTimer() {
    clearInterval(stepTimerInterval);
    stepTimeLeft = 5.0;
    stepTimerBar.style.width = '100%';

    const updateInterval = 50; // 0.05초 간격 업데이트
    stepTimerInterval = setInterval(() => {
      stepTimeLeft -= updateInterval / 1000;
      const percentage = Math.max(0, (stepTimeLeft / 5.0) * 100);
      stepTimerBar.style.width = `${percentage}%`;

      if (stepTimeLeft <= 0) {
        clearInterval(stepTimerInterval);
        triggerFall();
        setTimeout(() => {
          endGame("5초 제한시간이 초과되었습니다!");
        }, 500);
      }
    }, updateInterval);
  }

  // 답안 제출 핸들러
  function handleAnswer(isCorrect) {
    if (!isGameActive) return;

    clearInterval(stepTimerInterval);

    if (isCorrect) {
      // 총 12문제 기준 만점 100점이 되도록 점수 산정
      // 문제당 기본 7점 + 남은 시간(최대 5초) 비례 보너스 최대 1.33점 = 문제당 최대 8.33점 (12 * 8.33 ≈ 100점)
      const baseScore = 7;
      const speedBonus = (stepTimeLeft / 5.0) * 1.333;
      const questionScore = Math.round(baseScore + speedBonus);
      
      score += questionScore;
      if (score > 100) score = 100; // 만점 제한
      
      scoreDisplay.textContent = score;

      // 걸어가는 모션 부여
      workerChar.classList.add('walk');
      setTimeout(() => workerChar.classList.remove('walk'), 400);

      currentQuestionIndex++;
      checkAndLoadQuestion();
    } else {
      // 오답 피드백: 쓰러짐 효과 후 종료
      triggerFall();
      setTimeout(() => {
        endGame("틀린 사건을 선택했습니다!");
      }, 500);
    }
  }

  // 쓰러지는 애니메이션 연출
  function triggerFall() {
    workerChar.classList.remove('walk');
    workerChar.classList.add('fall');
    mouth.setAttribute('d', 'M 52 47 Q 56 42 58 46'); // 슬픈 입모양
  }

  // 모든 혁명 완주 - 환호하는 로직
  function triggerVictory() {
    isGameActive = false;
    clearInterval(totalTimerInterval);
    clearInterval(stepTimerInterval);

    // 모든 문제를 맞추었을 경우 최종 점수 100점으로 보정
    score = 100;
    scoreDisplay.textContent = score;

    // 환호 모습 적용
    workerChar.className = 'worker-character cheer';
    armLeft.setAttribute('d', 'M 33 58 L 20 30'); // 만세 자세
    armRight.setAttribute('d', 'M 67 58 L 80 30');
    mouth.setAttribute('d', 'M 50 42 Q 55 52 60 42 Z'); // 웃는 입

    setTimeout(() => {
      gameoverTitle.textContent = "혁명 완주 성공!";
      gameoverTitle.style.color = "#2ed573";
      gameoverReason.textContent = "축하합니다! 3대 혁명의 올바른 연대기를 완벽히 마스터하셨습니다 (100점 만점!)";
      gameOver(score);
    }, 1200);
  }

  // 게임 종료 처리
  function endGame(reason) {
    isGameActive = false;
    clearInterval(totalTimerInterval);
    clearInterval(stepTimerInterval);

    gameoverTitle.textContent = "GAME OVER";
    gameoverTitle.style.color = "#ff4757";
    gameoverReason.textContent = reason;
    gameOver(score);
  }

  // 규격 준수: gameOver(점수) 함수 선언 및 UI 출력
  function gameOver(finalScore) {
    finalScoreDisplay.textContent = finalScore;
    gameoverOverlay.classList.remove('hidden');
  }
</script>

</body>
</html>
